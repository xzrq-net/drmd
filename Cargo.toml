[package]
name = "drmd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
notify = "8.2.0"
open = "5.4.1"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
